<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bkRedCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E61E2A" />
      <stop offset="60%" stop-color="#B30E16" />
      <stop offset="100%" stop-color="#800A10" />
    </linearGradient>
    <linearGradient id="bkGoldArrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <linearGradient id="bkScreenBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="bkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Digital Screen Background -->
  <rect x="16" y="10" width="54" height="42" rx="6" fill="url(#bkScreenBlue)" filter="url(#bkShadow)" />
  <rect x="22" y="14" width="42" height="3" rx="1.5" fill="#38BDF8" opacity="0.6" />
  <rect x="22" y="21" width="30" height="2" rx="1" fill="#E2E8F0" opacity="0.4" />
  <rect x="22" y="26" width="36" height="2" rx="1" fill="#E2E8F0" opacity="0.3" />

  <!-- Hardcover Crimson Red Bahi Khata Ledger -->
  <g filter="url(#bkShadow)">
    <path d="M 38 22 L 80 22 C 82 22 84 24 84 26 L 82 66 C 82 68 80 70 78 70 L 36 70 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8" />
    <line x1="52" y1="28" x2="76" y2="28" stroke="#94A3B8" stroke-width="1" stroke-linecap="round" />
    <line x1="52" y1="33" x2="74" y2="33" stroke="#CBD5E1" stroke-width="1" stroke-linecap="round" />
    <line x1="52" y1="38" x2="76" y2="38" stroke="#CBD5E1" stroke-width="1" stroke-linecap="round" />
    <rect x="54" y="47" width="3.5" height="12" rx="1" fill="#0284C7" />
    <rect x="60" y="43" width="3.5" height="16" rx="1" fill="#10B981" />
    <rect x="66" y="40" width="3.5" height="19" rx="1" fill="#F59E0B" />
    <rect x="72" y="49" width="3.5" height="10" rx="1" fill="#E11D48" />

    <!-- Red Book Front Cover tilted -->
    <path d="M 22 28 C 22 26 24 24 27 24 L 46 20 C 49 19 51 21 51 24 L 48 76 C 48 79 46 81 43 81 L 24 85 C 22 85 20 83 20 80 Z" fill="url(#bkRedCover)" stroke="#991B1B" stroke-width="0.8" />
    <path d="M 23 28 L 21 82" stroke="#FBBF24" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.7" />
    <text x="34" y="54" fill="#FDE68A" font-size="18" font-weight="900" font-family="sans-serif" text-anchor="middle" filter="url(#bkShadow)">₹</text>
  </g>

  <!-- Sweeping 3D Golden Growth Arrow swoosh around book -->
  <path d="M 12 50 C 8 68 28 84 56 80 C 72 78 84 66 90 48" fill="none" stroke="url(#bkGoldArrow)" stroke-width="6" stroke-linecap="round" filter="url(#bkShadow)" />
  <polygon points="90,44 95,30 82,37" fill="#F59E0B" filter="url(#bkShadow)" />
</svg>
